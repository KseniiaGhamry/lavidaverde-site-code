<!-- LA VIDA VERDE: gateway only. Place in a T123 block on a NEW Tilda page.
DO NOT paste into Site Settings > HEAD, /uae, or /egypt. -->
<link rel="stylesheet" href="https://kseniiaghamry.github.io/lavidaverde-site-code/gateway/gateway.css">
<section class="lvvg-gateway" data-language="en" lang="en" aria-label="La Vida Verde — choose your country">
  <div class="lvvg-gateway__photo" aria-hidden="true"></div>
  <div class="lvvg-gateway__shell">
    <header class="lvvg-gateway__top">
      <div class="lvvg-gateway__brand">La Vida Verde</div>
      <nav class="lvvg-gateway__languages" aria-label="Choose language">
        <button type="button" data-lvvg-language="en" aria-pressed="true">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-lvvg-language="ar" aria-pressed="false" lang="ar">العربية</button>
      </nav>
    </header>
    <div class="lvvg-gateway__content">
      <h1 class="lvvg-gateway__heading" data-lvvg-copy="heading">Bespoke artificial greenery</h1>
      <p class="lvvg-gateway__description" data-lvvg-copy="description">Trees, plants, and bespoke green installations for exceptional hospitality and commercial interiors.</p>
      <nav class="lvvg-gateway__selector" aria-label="Choose your country">
        <p class="lvvg-gateway__selector-title" data-lvvg-copy="selector">Choose your country</p>
        <div class="lvvg-gateway__links">
          <a class="lvvg-gateway__choice lvvg-gateway__choice--uae" href="https://lavidaverde.ae/uae">
            <span data-lvvg-copy="uae">United Arab Emirates / الإمارات</span>
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 14h21M16 6l8 8-8 8"/></svg>
          </a>
          <a class="lvvg-gateway__choice" href="https://lavidaverde.ae/egypt">
            <span data-lvvg-copy="egypt">Egypt / مصر</span>
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 14h21M16 6l8 8-8 8"/></svg>
          </a>
        </div>
      </nav>
    </div>
  </div>
</section>
<script src="https://kseniiaghamry.github.io/lavidaverde-site-code/gateway/gateway.js" defer></script>
